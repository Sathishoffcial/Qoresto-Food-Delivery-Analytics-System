<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QORESTO | Payment Success</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    135deg,
    #050B16,
    #08111f,
    #0F172A);

    overflow:hidden;
}

/* Background Glow */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(77,223,255,.08);
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(120px);
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:rgba(77,223,255,.08);
    border-radius:50%;
    bottom:-150px;
    right:-150px;
    filter:blur(120px);
}

/* Success Card */

.success-card{

    position:relative;
    z-index:2;

    width:550px;

    background:
    linear-gradient(
    145deg,
    #0F172A,
    #111827);

    border-radius:30px;

    padding:50px;

    text-align:center;

    border:1px solid rgba(77,223,255,.18);

    box-shadow:
    0 0 35px rgba(77,223,255,.15);
}

/* Icon */

.success-icon{

    width:110px;
    height:110px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #4ddfff,
    #00d4ff);

    color:black;

    font-size:55px;

    margin-bottom:25px;

    box-shadow:
    0 0 30px rgba(77,223,255,.5);
}

h1{
    color:#4ddfff;
    font-size:42px;
    margin-bottom:10px;
}

h2{
    color:white;
    margin-bottom:30px;
}

.info-box{

    background:#0b1220;

    border-radius:20px;

    padding:25px;

    margin-bottom:30px;

    border:1px solid rgba(77,223,255,.15);
}

.info-box p{

    font-size:18px;

    color:#cbd5e1;

    margin:12px 0;
}

.info-box b{
    color:#4ddfff;
}

/* Buttons */

.btn-group{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{

    padding:14px 28px;

    border-radius:12px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

.primary{

    background:
    linear-gradient(
    135deg,
    #4ddfff,
    #00d4ff);

    color:black;
}

.secondary{

    background:#111827;

    color:#4ddfff;

    border:1px solid rgba(77,223,255,.2);
}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 0 20px rgba(77,223,255,.4);
}

/* Footer */

.footer{
    margin-top:25px;
    color:#94A3B8;
    font-size:13px;
}

</style>
</head>

<body>

<div class="success-card">

<div class="success-icon">
    <i class="fa-solid fa-check"></i>
</div>

<h1>Payment Successful</h1>

<h2>Your Order Has Been Confirmed</h2>

<div class="info-box">

    <p>
        Order ID :
        <b>#{{ order_id }}</b>
    </p>

    <p>
        Total Paid :
        <b>₹{{ total }}</b>
    </p>

</div>

<div class="btn-group">

    <a href="/my-orders"
       class="btn primary">
       View My Orders
    </a>

    <a href="/home"
       class="btn secondary">
       Continue Shopping
    </a>

</div>

<div class="footer">
    © 2026 QORESTO Analytics Platform
</div>

</div>

</body>
</html>
