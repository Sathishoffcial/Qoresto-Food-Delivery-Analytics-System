<!DOCTYPE html>
<html>
<head>
    <title>QORESTO | Edit Restaurant</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#050B16;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:rgba(77,223,255,.08);
    border-radius:50%;
    top:-150px;
    right:-150px;
    filter:blur(120px);
}

.container{

    width:100%;
    max-width:750px;

    background:
    linear-gradient(
    145deg,
    #0F172A,
    #111827);

    border:1px solid rgba(77,223,255,.18);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 0 35px rgba(77,223,255,.15);

    z-index:1;
}

h1{

    text-align:center;

    color:#4ddfff;

    margin-bottom:30px;

    font-size:38px;
}

.restaurant-preview{

    text-align:center;

    margin-bottom:25px;
}

.restaurant-preview img{

    width:140px;
    height:140px;

    object-fit:cover;

    border-radius:15px;

    border:3px solid #4ddfff;
}

.restaurant-preview h3{

    margin-top:15px;

    color:#4ddfff;
}

.input-group{

    margin-bottom:20px;
}

label{

    display:block;

    margin-bottom:8px;

    color:#cfefff;

    font-weight:600;
}

input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid rgba(77,223,255,.2);

    background:#111827;

    color:white;

    font-size:15px;
}

input:focus{

    outline:none;

    border-color:#4ddfff;

    box-shadow:
    0 0 15px rgba(77,223,255,.25);
}

.update-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
    135deg,
    #4ddfff,
    #00d4ff);

    color:black;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.update-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 25px rgba(77,223,255,.35);
}

.back-btn{

    display:block;

    text-align:center;

    margin-top:20px;

    padding:14px;

    border-radius:12px;

    text-decoration:none;

    color:#4ddfff;

    border:1px solid rgba(77,223,255,.2);

    background:#111827;

    font-weight:600;
}

.back-btn:hover{
    background:#162033;
}

</style>

</head>

<body>

<div class="container">

<h1>✏️ Edit Restaurant</h1>

<div class="restaurant-preview">

    <img src="{{ restaurant.image_url }}"
         alt="Restaurant Image">

    <h3>{{ restaurant.restaurant_name }}</h3>

</div>

<form action="/update/{{ restaurant.restaurant_id }}"
      method="POST">

    <div class="input-group">

        <label>Restaurant Name</label>

        <input type="text"
               name="restaurant_name"
               value="{{ restaurant.restaurant_name }}"
               required>

    </div>

    <div class="input-group">

        <label>City</label>

        <input type="text"
               name="city"
               value="{{ restaurant.city }}"
               required>

    </div>

    <div class="input-group">

        <label>Cuisine</label>

        <input type="text"
               name="cuisine"
               value="{{ restaurant.cuisine }}"
               required>

    </div>

    <div class="input-group">

        <label>Rating</label>

        <input type="number"
               step="0.1"
               name="rating"
               value="{{ restaurant.rating }}"
               required>

    </div>

    <div class="input-group">

        <label>Cost For Two</label>

        <input type="number"
               name="cost_for_two"
               value="{{ restaurant.cost_for_two }}"
               required>

    </div>

    <div class="input-group">

        <label>Image URL</label>

        <input type="text"
               name="image_url"
               value="{{ restaurant.image_url }}"
               required>

    </div>

    <button type="submit"
            class="update-btn">

        Update Restaurant

    </button>

</form>

<a href="/admin_dashboard"
   class="back-btn">

   ← Back to Dashboard

</a>

</div>

</body>
</html>
