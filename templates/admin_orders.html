<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders</title>
</head>
<body>
<h1>📦 Manage Orders</h1>

<table>
<tr>
    <th>Order ID</th>
    <th>Status</th>
    <th>Update Status</th>
</tr>

{% for order in orders %}
<tr>

<td>{{ order.order_id }}</td>

<td>{{ order.order_status }}</td>

<td>

<form action="/admin/update_order_status/{{ order.order_id }}"
      method="POST">

<select name="status">

<option>Order Placed</option>
<option>Confirmed</option>
<option>Preparing Food</option>
<option>Ready for Pickup</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>

</select>

<button type="submit">
Update
</button>

</form>

</td>

</tr>
{% endfor %}

</table>


</table>
<h1>Manage Orders</h1>

{% for order in orders %}

<div>

    <h3>Order #{{ order.order_id }}</h3>

    <p>{{ order.items }}</p>

    <p>{{ order.order_status }}</p>

    <form action="/update_order_status/{{ order.order_id }}"
          method="POST">

        <select name="status">

            <option>Order Placed</option>
            <option>Preparing Food</option>
            <option>Out For Delivery</option>
            <option>Delivered</option>
            <option>Cancelled</option>

        </select>

        <button type="submit">
            Update
        </button>

    </form>

</div>

{% endfor %}
<form action="/update_status/{{ order.order_id }}"
      method="POST">

<select name="status">

<option>Order Placed</option>
<option>Preparing</option>
<option>Out For Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>

</select>

<button type="submit">
Update
</button>

</form>

</body>
</html>
