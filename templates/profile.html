<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #050b14,
        #08131f,
        #0b1725,
        #06101c
    );

    color:white;
}

/* Profile Card */

.card{
    width:450px;

    background:
    rgba(255,255,255,0.05);

    border:1px solid rgba(77,223,255,.2);

    backdrop-filter:blur(18px);

    border-radius:25px;

    padding:35px;

    box-shadow:
    0 0 25px rgba(77,223,255,.15);

    transition:.4s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:
    0 0 40px rgba(77,223,255,.3);
}

/* Heading */

h1{
    text-align:center;
    margin-bottom:25px;

    color:#4ddfff;

    font-size:32px;

    text-shadow:
    0 0 20px rgba(77,223,255,.5);
}

/* Profile Image */

.profile-img{
    width:140px;
    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #4ddfff;

    box-shadow:
    0 0 25px rgba(77,223,255,.4);

    margin-bottom:20px;
}

/* User Details */

.info-box{
    background:
    rgba(255,255,255,.04);

    padding:15px;

    margin-bottom:12px;

    border-radius:12px;

    border-left:4px solid #4ddfff;
}

.info-box strong{
    color:#4ddfff;
}

/* Buttons */

button{
    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    margin-top:10px;

    background:
    linear-gradient(
        45deg,
        #4ddfff,
        #00c8ff
    );

    color:black;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
    0 0 20px rgba(77,223,255,.5);
}

/* Upload Section */

.upload-section{
    margin-top:25px;

    text-align:center;
}

input[type=file]{

    width:100%;

    padding:12px;

    background:
    rgba(255,255,255,.05);

    border:1px solid rgba(77,223,255,.2);

    border-radius:10px;

    color:white;
}

input[type=file]::file-selector-button{

    background:#4ddfff;
    color:black;

    border:none;

    padding:8px 15px;

    border-radius:8px;

    cursor:pointer;
}

</style>
</head>
<body>

<div class="card">

    <h1>My Profile</h1>

    {% if user.profile_image %}
        <center>
            <img
class="profile-img"
src="{{ url_for('static', filename='uploads/' + user.profile_image) }}">
        </center>
    {% endif %}
    <div class="info-box">
    <strong>Name:</strong> {{ user.name }}
</div>

<div class="info-box">
    <strong>Email:</strong> {{ user.email }}
</div>

<div class="info-box">
    <strong>Phone:</strong> {{ user.phone }}
</div>

<div class="info-box">
    <strong>Address:</strong> {{ user.address }}
</div>


    <br>

    <a href="/edit_profile">
        <button>Edit Profile</button>
    </a>

    <div class="upload-section">

        <form action="/upload_profile"
              method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="profile_image"
                   required>

            <br><br>

            <button type="submit">
                Upload Profile Picture
            </button>

        </form>

    </div>

</div>

</body>
</html>
