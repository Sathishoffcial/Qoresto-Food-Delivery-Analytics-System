
<!DOCTYPE html>
<html>
<head>
    <title>QORESTO | Checkout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#050B16;
            color:white;
            font-family:'Segoe UI',sans-serif;
            min-height:100vh;
            padding:40px;
        }

        body::before{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:rgba(77,223,255,.08);
            border-radius:50%;
            top:-150px;
            right:-150px;
            filter:blur(120px);
            z-index:-1;
        }

        .container{

            max-width:1100px;
            margin:auto;
        }

        .page-title{

            text-align:center;
            margin-bottom:40px;
        }

        .page-title h1{

            color:#4ddfff;
            font-size:42px;
        }

        .checkout-grid{

            display:grid;
            grid-template-columns:2fr 1fr;
            gap:30px;
        }

        .card{

            background:linear-gradient(
            145deg,
            #0f172a,
            #111827);

            border:1px solid rgba(77,223,255,.18);

            border-radius:25px;

            padding:30px;

            box-shadow:
            0 0 20px rgba(77,223,255,.08);
        }

        .card h2{

            color:#4ddfff;
            margin-bottom:20px;
        }

        table{

            width:100%;
            border-collapse:collapse;
        }

        table th{

            background:#4ddfff;
            color:black;
            padding:15px;
        }

        table td{

            padding:15px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,.08);
        }

        .summary-row{

            display:flex;
            justify-content:space-between;
            margin-bottom:15px;
            font-size:18px;
        }

        .grand-total{

            font-size:28px;
            font-weight:bold;
            color:#00ff88;
        }

        select{

            width:100%;
            padding:14px;

            background:#111827;

            color:white;

            border:1px solid rgba(77,223,255,.25);

            border-radius:12px;

            margin-top:15px;
        }

        .place-order{

            width:100%;

            padding:16px;

            margin-top:25px;

            border:none;

            border-radius:15px;

            background:linear-gradient(
            135deg,
            #4ddfff,
            #00d4ff);

            color:black;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;
        }

        .place-order:hover{

            transform:translateY(-3px);

            box-shadow:
            0 0 25px rgba(77,223,255,.35);
        }

        .security-box{

            margin-top:25px;

            background:#111827;

            border-radius:15px;

            padding:15px;

            text-align:center;

            color:#cbd5e1;
        }

        .back-btn{

            display:inline-block;

            margin-top:20px;

            text-decoration:none;

            padding:12px 20px;

            background:#111827;

            color:#4ddfff;

            border-radius:12px;
        }

        @media(max-width:900px){

            .checkout-grid{
                grid-template-columns:1fr;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="page-title">

        <h1>🛒 Checkout</h1>

        <p>Secure Order Processing</p>

    </div>

    <div class="checkout-grid">

        <!-- ORDER ITEMS -->

        <div class="card">

            <h2>Order Summary</h2>

            <table>

                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>

                {% for item in cart_items %}

                <tr>

                    <td>{{ item.item_name }}</td>

                    <td>{{ item.quantity }}</td>

                    <td>₹{{ item.total }}</td>

                </tr>

                {% endfor %}

            </table>

        </div>

        <!-- PAYMENT -->

        <div class="card">

            <h2>Payment Details</h2>

            <div class="summary-row">

                <span>Total Amount</span>

                <span class="grand-total">
                    ₹{{ total_amount }}
                </span>

            </div>

            <form action="/place_order"
                  method="POST">

                <label>
                    Payment Method
                </label>

                <select name="payment_method">

                    <option value="Cash On Delivery">
                        Cash On Delivery
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Card">
                        Credit / Debit Card
                    </option>

                </select>

                <button type="submit"
                        class="place-order">

                    🚀 Place Order

                </button>

            </form>

            <div class="security-box">

                🔒 Secure Payment Gateway

                <br><br>

                Powered by QORESTO

            </div>

            <a href="/cart"
               class="back-btn">

               ← Back To Cart

            </a>

        </div>

    </div>

</div>

</body>
</html>
