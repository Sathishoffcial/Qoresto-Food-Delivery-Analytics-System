
<!DOCTYPE html>
<html>
<head>
    <title>Qoresto | Add Restaurant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            margin:0;
            padding:0;
            background:#050B16;
            font-family:'Segoe UI',sans-serif;
            color:white;
        }

        body::before{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:rgba(77,223,255,.08);
            border-radius:50%;
            top:-150px;
            right:-150px;
            filter:blur(120px);
            z-index:-1;
        }

        .container{
            width:700px;
            margin:50px auto;
        }

        .form-card{

            background:linear-gradient(
            145deg,
            #0f172a,
            #111827);

            border:1px solid rgba(77,223,255,.25);

            border-radius:25px;

            padding:40px;

            box-shadow:
            0 0 40px rgba(77,223,255,.15);
        }

        h1{
            text-align:center;
            color:#4ddfff;
            font-size:40px;
            margin-bottom:35px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#d8f7ff;
            font-weight:500;
        }

        input{

            width:100%;

            padding:15px;

            border-radius:12px;

            border:1px solid rgba(77,223,255,.25);

            background:#0b1220;

            color:white;

            font-size:15px;

            box-sizing:border-box;

            margin-bottom:20px;
        }

        input:focus{

            outline:none;

            border-color:#4ddfff;

            box-shadow:
            0 0 15px rgba(77,223,255,.35);
        }

        .submit-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:12px;

            background:linear-gradient(
            135deg,
            #4ddfff,
            #00d4ff);

            color:black;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;
        }

        .submit-btn:hover{

            transform:translateY(-3px);

            box-shadow:
            0 0 20px rgba(77,223,255,.4);
        }

        .back-btn{

            display:block;

            text-align:center;

            margin-top:20px;

            padding:14px;

            background:#111827;

            border:1px solid rgba(77,223,255,.2);

            border-radius:12px;

            color:#4ddfff;

            text-decoration:none;

            font-weight:600;
        }

        .back-btn:hover{
            background:#162033;
        }

    </style>

</head>

<body>

<div class="container">

<div class="form-card">

<h1>🍽️ Add New Restaurant</h1>

<p style="
text-align:center;
color:#9fb8d0;
margin-bottom:30px;">
Manage and expand your restaurant network
inside the QORESTO platform.
</p>

<form action="/add_restaurant" method="POST">

    <label>Restaurant Name</label>
    <input type="text"
           name="restaurant_name"
           required>

    <label>City</label>
    <input type="text"
           name="city"
           required>

    <label>Cuisine</label>
    <input type="text"
           name="cuisine"
           required>

    <label>Rating</label>
    <input type="number"
           step="0.1"
           name="rating"
           required>

    <label>Cost For Two</label>
    <input type="number"
           name="cost_for_two"
           required>

    <label>Image URL</label>
    <input type="text"
           name="image_url"
           required>

    <button type="submit"
            class="submit-btn">
        Add Restaurant
    </button>

</form>

<a href="/home"
   class="back-btn">
   ← Back Home
</a>

</div>

</div>

</body>
</html>
