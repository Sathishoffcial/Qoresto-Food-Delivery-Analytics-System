
<!DOCTYPE html>
<html>
<head>
    <title>QORESTO | Add Restaurant</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#050B16;
        font-family:'Segoe UI',sans-serif;
        color:white;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px;
    }

    .container{

        width:700px;

        background:
        linear-gradient(
        145deg,
        #0F172A,
        #111827);

        border:1px solid rgba(77,223,255,.18);

        border-radius:25px;

        padding:40px;

        box-shadow:
        0 0 35px rgba(77,223,255,.15);
    }

    h1{

        text-align:center;

        color:#4ddfff;

        margin-bottom:30px;

        font-size:38px;
    }

    .input-group{

        margin-bottom:20px;
    }

    label{

        display:block;

        margin-bottom:8px;

        color:#cfefff;

        font-weight:600;
    }

    input{

        width:100%;

        padding:14px;

        border-radius:12px;

        border:1px solid rgba(77,223,255,.2);

        background:#111827;

        color:white;

        font-size:15px;
    }

    input:focus{

        outline:none;

        border-color:#4ddfff;

        box-shadow:
        0 0 15px rgba(77,223,255,.25);
    }

    .submit-btn{

        width:100%;

        padding:15px;

        border:none;

        border-radius:15px;

        background:
        linear-gradient(
        135deg,
        #4ddfff,
        #00d4ff);

        color:black;

        font-size:17px;

        font-weight:bold;

        cursor:pointer;

        transition:.3s;
    }

    .submit-btn:hover{

        transform:translateY(-3px);

        box-shadow:
        0 0 25px rgba(77,223,255,.35);
    }

    .action-buttons{

        margin-top:25px;

        display:flex;

        gap:10px;

        flex-wrap:wrap;
    }

    .action-buttons a,
    .action-buttons button{

        flex:1;

        min-width:180px;

        padding:12px;

        border:none;

        border-radius:12px;

        text-decoration:none;

        text-align:center;

        font-weight:700;

        cursor:pointer;
    }

    .favorite-btn{
        background:#ff4081;
        color:white;
    }

    .cart-btn{
        background:#00e676;
        color:black;
    }

    .home-btn{
        background:#4ddfff;
        color:black;
    }

    </style>

</head>

<body>

<div class="container">

<h1>🍽 Add Restaurant</h1>

<form action="/add_restaurant" method="POST">

    <div class="input-group">
        <label>Restaurant Name</label>
        <input type="text"
               name="restaurant_name"
               required>
    </div>

    <div class="input-group">
        <label>City</label>
        <input type="text"
               name="city"
               required>
    </div>

    <div class="input-group">
        <label>Cuisine</label>
        <input type="text"
               name="cuisine"
               required>
    </div>

    <div class="input-group">
        <label>Rating</label>
        <input type="number"
               step="0.1"
               name="rating"
               required>
    </div>

    <div class="input-group">
        <label>Cost For Two</label>
        <input type="number"
               name="cost_for_two"
               required>
    </div>

    <div class="input-group">
        <label>Image URL</label>
        <input type="text"
               name="image_url"
               required>
    </div>

    <button type="submit"
            class="submit-btn">
        Add Restaurant
    </button>

</form>

{% if restaurant %}

<div class="action-buttons">

    <a href="/add_favorite/{{ restaurant.restaurant_id }}"
       class="favorite-btn">
        ❤️ Add to Favorites
    </a>

    <form action="/add_to_cart/{{ restaurant.restaurant_id }}"
          method="POST">

        <button type="submit"
                class="cart-btn">
            🛒 Add To Cart
        </button>

    </form>

</div>

{% endif %}

<div class="action-buttons">

    <a href="/home"
       class="home-btn">
       ← Back Home
    </a>

</div>

</div>

</body>
</html>
